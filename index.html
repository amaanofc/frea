<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frea — find your senior mentor</title>
    <meta name="description" content="Connect with senior university students who've achieved real success. Book a free 20-minute call and get the mentoring you deserve." />

    <!-- Google Fonts: Fraunces (serif display) + Plus Jakarta Sans (humanist body) + Caveat (handwritten scrawl) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Favicon - custom frea notebook stamp -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='15' y='12' width='70' height='76' rx='14' fill='%23fdfbf9' stroke='%23171717' stroke-width='6'/><path d='M50 12v26l10-8 10 8V12' fill='%23ff6f1e' stroke='%23171717' stroke-width='4'/><circle cx='40' cy='56' r='5' fill='%23171717'/><circle cx='64' cy='56' r='5' fill='%23171717'/><path d='M44 68c3 5 13 5 16 0' stroke='%23171717' stroke-width='5' stroke-linecap='round'/></svg>">
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
      <a class="navbar__brand" data-navigate="/">
        <svg class="navbar__icon" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Notebook badge -->
          <rect x="7" y="6" width="28" height="30" rx="7" fill="#fdfbf9" stroke="#171717" stroke-width="2.2"/>
          <line x1="14" y1="6" x2="14" y2="36" stroke="#171717" stroke-width="1.8" stroke-dasharray="2.5 2.5"/>
          <!-- Orange bookmark ribbon -->
          <path d="M22 6v11l4-3.5 4 3.5V6" fill="#ff6f1e" stroke="#171717" stroke-width="1.8" stroke-linejoin="round"/>
          <!-- Hand-drawn face -->
          <circle cx="19.5" cy="22.5" r="1.6" fill="#171717"/>
          <circle cx="28.5" cy="22.5" r="1.6" fill="#171717"/>
          <path d="M21 26.5c1.8 2.5 5.2 2.5 7 0" stroke="#171717" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="16.5" cy="25" r="1.3" fill="#ff66cf" opacity="0.8"/>
          <circle cx="31.5" cy="25" r="1.3" fill="#ff66cf" opacity="0.8"/>
          <!-- Little corner sparkle -->
          <path d="M33 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2z" fill="#ff6f1e"/>
        </svg>
        <div class="navbar__brand-group">
          <span class="navbar__name">frea</span>
          <span class="navbar__dot"></span>
        </div>
      </a>
      <div class="navbar__actions">
        <span class="navbar__pill-tag">free for all students</span>
        <button class="pill-btn" data-navigate="/browse" id="nav-cta">find a senior mentor</button>
      </div>
    </nav>

    <!-- App Root -->
    <div id="app"></div>

    <!-- Modal Root -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal-content"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
