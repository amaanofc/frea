    <!-- Structured Data: JSON-LD for Google Search & SERP Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "EducationalOrganization",
          "@id": "https://joinfrea.com/#organization",
          "name": "frea",
          "url": "https://joinfrea.com",
          "logo": "https://joinfrea.com/favicon.svg",
          "description": "Free student peer-to-peer mentoring platform for UK higher education students.",
          "areaServed": "GB",
          "knowsAbout": ["Higher Education Mentoring", "Spring Weeks", "Summer Analyst Internships", "Graduate Schemes", "Exam Techniques"]
        },
        {
          "@type": "Service",
          "@id": "https://joinfrea.com/#service",
          "name": "frea 1-on-1 Senior Student Mentoring",
          "provider": { "@id": "https://joinfrea.com/#organization" },
          "serviceType": "Peer Mentoring",
          "audience": {
            "@type": "Audience",
            "audienceType": "UK University Students"
          },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "GBP",
            "description": "100% free 20-minute mentoring calls for UK university students, verified through their own university login."
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://joinfrea.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is frea really 100% free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, completely free for all UK university students. Our senior mentors volunteer 20 to 40 minutes a week to pay it forward. There are zero hidden fees or premium subscriptions."
              }
            },
            {
              "@type": "Question",
              "name": "Who can book a call on frea?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Any current student or recent graduate at an accredited UK university who can sign in through their institution."
              }
            },
            {
              "@type": "Question",
              "name": "How does frea verify students?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Students sign in through their own university, over the UK Access Management Federation. The institution itself confirms they are a current student, so every participant is a genuine student peer."
              }
            }
          ]
        }
      ]
    }
    </script>
